workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: discounthub_app_store

    environment:
      groups:
        - appstore_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.discounthub.app
      vars:
        BUNDLE_ID: "uz.discounthub.app"
        APP_NAME: "DiscountHub"
        APPLE_TEAM_ID: "Z8XC7UAF2N"
        IOS_PROFILE_NAME: "DiscountHub App Store Codemagic"
        DISCOUNTHUB_API_BASE_URL: "https://api.discounthub.uz"
        FLUTTER_BUILD_NAME: "1.0.0"
        FLUTTER_BUILD_NUMBER: "2"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Check App Store Connect publishing credentials
        script: |
          set -euo pipefail

          python3 <<'PY'
          import os

          required = [
              "APP_STORE_CONNECT_PRIVATE_KEY",
              "APP_STORE_CONNECT_KEY_IDENTIFIER",
              "APP_STORE_CONNECT_ISSUER_ID",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing App Store Connect env vars: " + ", ".join(missing))

          key = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip().strip('"').strip("'")
          key = key.replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n").strip()

          if not key.startswith("-----BEGIN PRIVATE KEY-----"):
              raise SystemExit("APP_STORE_CONNECT_PRIVATE_KEY must start with -----BEGIN PRIVATE KEY-----. Paste raw .p8 contents, not base64 and not a file path.")
          if not key.endswith("-----END PRIVATE KEY-----"):
              raise SystemExit("APP_STORE_CONNECT_PRIVATE_KEY must end with -----END PRIVATE KEY-----. Paste the full raw .p8 contents.")

          print("App Store Connect credentials are present and private key format looks valid.")
          print("Key ID:", os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"])
          print("Issuer ID:", os.environ["APP_STORE_CONNECT_ISSUER_ID"])
          PY

      - name: Prepare iOS manual signing
        script: |
          set -euo pipefail

          echo "Preparing iOS manual signing for $BUNDLE_ID"
          echo "Team ID: $APPLE_TEAM_ID"
          echo "Provisioning profile: $IOS_PROFILE_NAME"

          if ! ruby -e "require 'xcodeproj'" 2>/dev/null; then
            gem install xcodeproj --no-document
          fi

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          raise 'Runner target not found in ios/Runner.xcodeproj' unless runner

          runner.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'uz.discounthub.app'
            config.build_settings['DEVELOPMENT_TEAM'] = 'Z8XC7UAF2N'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'DiscountHub App Store Codemagic'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
          end

          project.build_configurations.each do |config|
            config.build_settings['DEVELOPMENT_TEAM'] = 'Z8XC7UAF2N'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
          end

          project.save
          puts 'Manual signing settings written to Runner target'
          RUBY

          cat > /Users/builder/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>Z8XC7UAF2N</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>uz.discounthub.app</key>
                  <string>DiscountHub App Store Codemagic</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          echo "Export options:"
          cat /Users/builder/export_options.plist

          echo "Installed signing identities:"
          security find-identity -v -p codesigning || true

          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=$FLUTTER_BUILD_NAME \
            --build-number=$FLUTTER_BUILD_NUMBER \
            --dart-define=DISCOUNTHUB_API_BASE_URL=$DISCOUNTHUB_API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload IPA to App Store Connect manually
        script: |
          set -euo pipefail

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA file found in build/ios/ipa"
            exit 1
          fi

          echo "Uploading IPA manually with xcrun altool: $IPA_PATH"

          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          KEY_FILE="$PRIVATE_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          python3 <<'PY'
          import os
          from pathlib import Path

          key_id = os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"].strip()
          key = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip().strip('"').strip("'")
          key = key.replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n").strip()

          path = Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{key_id}.p8"
          path.write_text(key + "\n", encoding="utf-8")
          path.chmod(0o600)
          print(f"Wrote normalized App Store Connect key to {path}")
          PY

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
