workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: discounthub_app_store

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.discounthub.app
      vars:
        BUNDLE_ID: "uz.discounthub.app"
        APP_NAME: "DiscountHub"
        DISCOUNTHUB_API_BASE_URL: "https://api.discounthub.uz"
        FLUTTER_BUILD_NAME: "1.0.0"
        FLUTTER_BUILD_NUMBER: "2"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Set up iOS code signing
        script: |
          set -euo pipefail

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "Searching DiscountHub App Store provisioning profile in: $PROFILES_DIR"

          PROFILE_PATH=""
          while IFS= read -r -d '' profile; do
            security cms -D -i "$profile" > /tmp/profile.plist
            PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist | sed 's/^[^.]*\.//')
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
            PROFILE_METHOD=$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" /tmp/profile.plist 2>/dev/null || true)
            echo "Found profile: $PROFILE_NAME | bundle: $PROFILE_BUNDLE_ID"

            if [ "$PROFILE_BUNDLE_ID" = "$BUNDLE_ID" ]; then
              PROFILE_PATH="$profile"
              echo "Using profile: $PROFILE_NAME"
              break
            fi
          done < <(find "$PROFILES_DIR" -name "*.mobileprovision" -print0)

          if [ -z "$PROFILE_PATH" ]; then
            echo "No provisioning profile found for $BUNDLE_ID"
            exit 1
          fi

          echo "Applying signing only to ios/Runner.xcodeproj"
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --profile "$PROFILE_PATH"

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=$FLUTTER_BUILD_NAME \
            --build-number=$FLUTTER_BUILD_NUMBER \
            --dart-define=DISCOUNTHUB_API_BASE_URL=$DISCOUNTHUB_API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
