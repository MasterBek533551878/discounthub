workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: discounthub_app_store

    environment:
      groups:
        - appstore_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.discounthub.app
      vars:
        BUNDLE_ID: "uz.discounthub.app"
        APP_NAME: "DiscountHub"
        APPLE_TEAM_ID: "Z8XC7UAF2N"
        IOS_PROFILE_NAME: "DiscountHub App Store Codemagic"
        DISCOUNTHUB_API_BASE_URL: "https://api.discounthub.uz"
        FLUTTER_BUILD_NAME: "1.0.2"
        FLUTTER_BUILD_NUMBER: "29"
        ASC_KEY_ID: "27Z73JY49N"
        ASC_ISSUER_ID: "9e428926-ab1d-408c-b511-2723f2fed800"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Prepare and validate App Store Connect API key
        script: |
          set -euo pipefail

          : "${ASC_KEY_ID:?Missing ASC_KEY_ID in codemagic.yaml environment vars}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID in codemagic.yaml environment vars}"

          if [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ] && [ "$APP_STORE_CONNECT_ISSUER_ID" != "$ASC_ISSUER_ID" ]; then
            echo "Ignoring APP_STORE_CONNECT_ISSUER_ID from Codemagic env group; using ASC_ISSUER_ID from codemagic.yaml."
          fi

          python3 <<'PY'
          import os
          import re
          import sys

          issuer = os.environ.get("ASC_ISSUER_ID", "").strip()
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", issuer):
              print(f"ASC_ISSUER_ID in codemagic.yaml is not a valid UUID. Length={len(issuer)}.", file=sys.stderr)
              sys.exit(64)
          print(f"App Store Connect Issuer ID format: OK, length {len(issuer)}.")
          PY

          if [ -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] && [ "$APP_STORE_CONNECT_KEY_IDENTIFIER" != "$ASC_KEY_ID" ]; then
            echo "Ignoring APP_STORE_CONNECT_KEY_IDENTIFIER=$APP_STORE_CONNECT_KEY_IDENTIFIER from Codemagic env group; using ASC_KEY_ID=$ASC_KEY_ID from codemagic.yaml."
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          export ASC_PRIVATE_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          key_id = os.environ["ASC_KEY_ID"].strip()
          out_path = Path.home() / ".appstoreconnect" / "private_keys" / f"AuthKey_{key_id}.p8"

          raw_base64 = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY_BASE64", "").strip()
          raw_plain = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "").strip()

          if raw_base64:
              compact = "".join(raw_base64.split())
              try:
                  key = base64.b64decode(compact, validate=True).decode("utf-8")
              except Exception as exc:
                  raise SystemExit("APP_STORE_CONNECT_PRIVATE_KEY_BASE64 is not valid base64 of the .p8 file: " + str(exc))
          elif raw_plain:
              key = raw_plain.strip().strip('"').strip("'")
              key = key.replace("\\n", "\n").replace("\r\n", "\n").replace("\r", "\n").strip()
          else:
              raise SystemExit("Missing APP_STORE_CONNECT_PRIVATE_KEY_BASE64. Add it to Codemagic environment group appstore_credentials.")

          if not key.startswith("-----BEGIN PRIVATE KEY-----"):
              raise SystemExit("Decoded App Store Connect key does not start with -----BEGIN PRIVATE KEY-----. Use base64 of the raw .p8 file, not a path and not copied UI text.")
          if not key.endswith("-----END PRIVATE KEY-----"):
              raise SystemExit("Decoded App Store Connect key does not end with -----END PRIVATE KEY-----. Use the full .p8 file content.")

          out_path.write_text(key + "\n", encoding="utf-8")
          out_path.chmod(0o600)
          print(f"Prepared App Store Connect key file: {out_path}")
          print("Key ID:", key_id)
          print("Issuer ID format already validated by shell step")
          PY

          echo "Validating App Store Connect API access for $BUNDLE_ID..."
          app-store-connect apps list \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "@file:$ASC_PRIVATE_KEY_PATH" \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --platform IOS \
            --json

      - name: Prepare iOS manual signing
        script: |
          set -euo pipefail

          echo "Preparing iOS manual signing for $BUNDLE_ID"
          echo "Team ID: $APPLE_TEAM_ID"
          echo "Provisioning profile: $IOS_PROFILE_NAME"

          if ! ruby -e "require 'xcodeproj'" 2>/dev/null; then
            gem install xcodeproj --no-document
          fi

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          raise 'Runner target not found in ios/Runner.xcodeproj' unless runner

          runner.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'uz.discounthub.app'
            config.build_settings['DEVELOPMENT_TEAM'] = 'Z8XC7UAF2N'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'DiscountHub App Store Codemagic'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
          end

          project.build_configurations.each do |config|
            config.build_settings['DEVELOPMENT_TEAM'] = 'Z8XC7UAF2N'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
          end

          project.save
          puts 'Manual signing settings written to Runner target'
          RUBY

          cat > /Users/builder/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>Z8XC7UAF2N</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>uz.discounthub.app</key>
                  <string>DiscountHub App Store Codemagic</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          echo "Export options:"
          cat /Users/builder/export_options.plist

          echo "Installed signing identities:"
          security find-identity -v -p codesigning || true

          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=$FLUTTER_BUILD_NAME \
            --build-number=$FLUTTER_BUILD_NUMBER \
            --dart-define=DISCOUNTHUB_API_BASE_URL=$DISCOUNTHUB_API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload IPA to App Store Connect with explicit API key
        script: |
          set -euo pipefail

          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}"

          export ASC_PRIVATE_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ ! -f "$ASC_PRIVATE_KEY_PATH" ]; then
            echo "Missing prepared key file at $ASC_PRIVATE_KEY_PATH"
            exit 1
          fi

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA file found in build/ios/ipa"
            exit 1
          fi

          echo "Uploading IPA to App Store Connect: $IPA_PATH"
          app-store-connect publish \
            --path "$IPA_PATH" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key "@file:$ASC_PRIVATE_KEY_PATH" \
            --platform IOS \
            --altool-verbose-logging


    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

