workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: discounthub_app_store

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.discounthub.app
      vars:
        BUNDLE_ID: "uz.discounthub.app"
        APP_NAME: "DiscountHub"
        DISCOUNTHUB_API_BASE_URL: "https://api.discounthub.uz"
        FLUTTER_BUILD_NAME: "1.0.0"
        FLUTTER_BUILD_NUMBER: "2"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=$FLUTTER_BUILD_NAME \
            --build-number=$FLUTTER_BUILD_NUMBER \
            --dart-define=DISCOUNTHUB_API_BASE_URL=$DISCOUNTHUB_API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
